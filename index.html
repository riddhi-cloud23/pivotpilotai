<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f0">
  <title>PivotPilot AI — Adaptive Career Pivot Coach</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f4f0; --surface: #fff; --ink: #1d2724; --muted: #78817b; --line: #e7e9e3;
      --green: #245c48; --green-2: #34785f; --lime: #d7ed78; --soft-green: #edf4eb;
      --orange: #e58b60; --soft-orange: #fff0e8; --blue: #6b83d8; --soft-blue: #eef0ff;
      --rose: #ce6e68; --soft-rose: #fff0ed; --shadow: 0 12px 35px rgba(28,45,36,.055);
    }
    * { box-sizing: border-box }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    button, input, textarea, select { font: inherit }
    button { cursor: pointer }
    .app { display: grid; grid-template-columns: 248px minmax(0,1fr); min-height: 100vh; max-width: 1680px; margin: auto; }
    .sidebar { background: #fcfcf9; border-right: 1px solid var(--line); padding: 26px 16px 18px; display: flex; flex-direction: column; min-height: 100vh; position: sticky; top: 0; height: 100vh; }
    .brand { display:flex; align-items:center; gap:11px; padding: 0 10px 28px; }
    .brand-mark { width:37px; height:37px; background:var(--green); color:#fff; border-radius:12px; display:grid; place-items:center; font-size:19px; font-weight:800; letter-spacing:-2px; }
    .brand-name { font-size:16px; font-weight:780; letter-spacing:-.7px }
    .brand-name span { color:var(--green-2) }
    .workspace-label { color:#a0a69f; text-transform:uppercase; font-size:10px; font-weight:750; letter-spacing:1px; padding: 0 11px 9px; }
    .nav { display:grid; gap:4px }
    .nav-btn { display:flex; align-items:center; gap:12px; border:0; border-radius:10px; color:#737c76; background:transparent; padding:11px 12px; font-size:13px; text-align:left; transition:.2s; }
    .nav-btn:hover { background:#f2f4ef; color:var(--ink) }
    .nav-btn.active { color:var(--green); font-weight:700; background:#eaf1e9 }
    .nav-icon { width:18px; text-align:center; font-size:16px; opacity:.9 }
    .nav-count { margin-left:auto; background:#fff; border:1px solid var(--line); border-radius:99px; padding:2px 7px; color:#7c847e; font-size:10px }
    .sidebar-spacer { flex:1 }
    .sidebar-card { margin:12px 2px; padding:15px; border-radius:15px; background:#edf2e8; }
    .sidebar-card .eyebrow { color:#637665 }
    .sidebar-card h3 { font-size:14px; line-height:1.35; margin:8px 0 5px }
    .sidebar-card p { color:#69766c; font-size:11px; line-height:1.55; margin:0 0 12px }
    .user-row { border-top:1px solid var(--line); padding:16px 8px 0; display:flex; align-items:center; gap:10px }
    .avatar { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:#f7d9c8; color:#674737; font-weight:750; font-size:12px; flex:none }
    .user-meta { min-width:0; flex:1 }
    .user-meta strong { display:block; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
    .user-meta span { font-size:10px; color:var(--muted) }
    .main { min-width:0; padding:0 34px 46px; }
    .topbar { height:76px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); gap:16px; }
    .breadcrumb { color:#858d87; font-size:12px }
    .top-actions { display:flex; align-items:center; gap:10px }
    .save-status { display:flex; gap:6px; align-items:center; color:#879089; font-size:11px; }
    .save-dot { width:7px; height:7px; background:#70a582; border-radius:50% }
    .icon-btn { width:36px;height:36px; border:1px solid var(--line); border-radius:10px;background:#fff;color:#65716a }
    .page { max-width:1220px; margin:0 auto }
    .page-head { padding:30px 0 22px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px }
    .eyebrow { color:var(--green-2); text-transform:uppercase; font-size:10px; font-weight:800; letter-spacing:1.15px }
    h1 { margin:7px 0 6px; font-size:29px; letter-spacing:-1.15px; line-height:1.16 }
    .subhead { color:var(--muted); line-height:1.6; margin:0; font-size:13px }
    .btn { border:1px solid transparent; border-radius:9px; padding:10px 14px; font-size:12px; font-weight:700; transition:.18s; display:inline-flex; gap:8px; align-items:center; justify-content:center; text-decoration:none; white-space:nowrap }
    .btn:hover { transform:translateY(-1px); filter:brightness(.98) }
    .btn-primary { color:#fff; background:var(--green); box-shadow:0 5px 12px rgba(36,92,72,.14) }
    .btn-secondary { background:#fff; border-color:var(--line); color:#46534a }
    .btn-soft { background:var(--soft-green); color:var(--green); border-color:#dbe8d9 }
    .btn-danger { background:var(--soft-rose); color:#a44d48; border-color:#f1d8d4 }
    .btn-small { padding:7px 10px; font-size:11px }
    .grid { display:grid; gap:16px }
    .grid-2 { grid-template-columns:repeat(2,minmax(0,1fr)) }
    .grid-3 { grid-template-columns:repeat(3,minmax(0,1fr)) }
    .grid-4 { grid-template-columns:repeat(4,minmax(0,1fr)) }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:15px; box-shadow:var(--shadow); }
    .card-pad { padding:19px }
    .card-title { font-size:14px; font-weight:750; letter-spacing:-.2px; margin:0 }
    .card-note { color:var(--muted); font-size:11px; margin:6px 0 0; line-height:1.55 }
    .section-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:24px 0 12px }
    .section-heading h2 { font-size:15px; margin:0; letter-spacing:-.35px }
    .section-heading p { color:var(--muted); font-size:11px; margin:4px 0 0 }
    .hero { border-radius:19px; padding:24px 25px; background:var(--green); color:white; position:relative; overflow:hidden; min-height:204px; }
    .hero:after { content:""; position:absolute; width:270px; height:270px; border-radius:50%; border:1px solid rgba(255,255,255,.13); right:9%; top:-92px; box-shadow:0 0 0 30px rgba(255,255,255,.035),0 0 0 65px rgba(255,255,255,.025) }
    .hero-content { position:relative;z-index:1;max-width:640px }
    .hero .eyebrow { color:#cfdfae }
    .hero h1 { max-width:580px; font-size:30px; line-height:1.2; margin:12px 0 9px }
    .hero p { color:#d5e0d9; max-width:570px; line-height:1.6; font-size:12px; margin:0 }
    .hero-actions { display:flex; gap:9px; margin-top:17px }
    .hero .btn-primary { background:var(--lime); color:#273520; box-shadow:none }
    .hero .btn-secondary { background:rgba(255,255,255,.11); color:white; border-color:rgba(255,255,255,.22) }
    .metric { padding:17px 18px; min-height:110px }
    .metric-label { color:#7a837c; font-size:11px; font-weight:650 }
    .metric-value { font-size:25px; font-weight:780; letter-spacing:-1px; margin:9px 0 3px }
    .metric-foot { color:#869088; font-size:10px }
    .metric-icon { float:right; width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:var(--soft-green);color:var(--green);font-size:14px }
    .progress { height:7px; border-radius:8px; background:#eff1ec; overflow:hidden }
    .progress > i { height:100%; display:block; background:var(--green-2); border-radius:inherit; transition:width .4s }
    .progress-label { display:flex;justify-content:space-between;gap:8px;color:#7c857e;font-size:10px;margin-bottom:8px }
    .list-row { display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #f0f1ed }
    .list-row:last-child { border-bottom:0;padding-bottom:0 }
    .list-row:first-child { padding-top:0 }
    .row-icon { width:34px;height:34px;border-radius:10px;background:#f3f5ef;display:grid;place-items:center;color:#56735f;flex:none }
    .row-main { min-width:0;flex:1 }
    .row-main strong { font-size:12px;display:block }
    .row-main span { display:block;font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4 }
    .tag { display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:700;white-space:nowrap }
    .tag-match { color:#327354;background:#eaf5ed }
    .tag-partial { color:#aa7135;background:#fff4e3 }
    .tag-missing { color:#b35650;background:#fff0ed }
    .tag-neutral { color:#69766e;background:#f0f2ed }
    .tag-blue { color:#596fbd;background:#edf0ff }
    .divider { height:1px;background:var(--line);margin:15px 0 }
    .callout { padding:13px 14px;border:1px solid #e1e9d8;background:#f6f9f2;border-radius:11px;display:flex;gap:10px;align-items:flex-start }
    .callout p { margin:0;color:#58665c;font-size:11px;line-height:1.55 }
    .callout strong { color:#314d3c }
    .toolbar { display:flex;gap:8px;align-items:center;flex-wrap:wrap }
    .select,.field,.textarea { border:1px solid #dfe4dc;background:#fff;border-radius:9px;padding:10px 11px;color:var(--ink);outline:none;width:100%;font-size:12px;transition:border .16s,box-shadow .16s }
    .select:focus,.field:focus,.textarea:focus { border-color:#84a891;box-shadow:0 0 0 3px rgba(52,120,95,.1) }
    .textarea { min-height:130px;resize:vertical;line-height:1.6 }
    .field-label { display:block;font-size:11px;font-weight:700;color:#56625a;margin:0 0 6px }
    .field-help { color:#949c96;font-size:10px;margin-top:5px;line-height:1.45 }
    .form-grid { display:grid;grid-template-columns:1fr 1fr;gap:14px }
    .form-field.full { grid-column:1/-1 }
    .filter-chip { border:1px solid var(--line);border-radius:99px;background:#fff;color:#7a847c;padding:7px 11px;font-size:10px;font-weight:700 }
    .filter-chip.active { color:var(--green);border-color:#bdd4c0;background:#eef5ed }
    .skill-card { padding:15px;transition:transform .18s,border .18s;cursor:pointer }
    .skill-card:hover { transform:translateY(-2px);border-color:#cad8c9 }
    .skill-card-top { display:flex;justify-content:space-between;align-items:flex-start;gap:8px }
    .skill-card h3 { font-size:13px;margin:0 0 7px }
    .skill-card p { color:var(--muted);font-size:10px;line-height:1.55;margin:10px 0 0 }
    .skill-mini { height:5px;background:#f0f1ed;border-radius:5px;margin-top:12px;overflow:hidden }
    .skill-mini i { height:100%;display:block;border-radius:5px;background:var(--green-2) }
    .week { overflow:hidden }
    .week-head { padding:16px 18px;display:flex;align-items:center;gap:13px;border-bottom:1px solid #eff0ec }
    .week-number { width:35px;height:35px;border-radius:11px;background:#edf3e9;color:#37664b;display:grid;place-items:center;font-size:11px;font-weight:800 }
    .week-meta { min-width:0;flex:1 }
    .week-meta h3 { font-size:13px;margin:0 }
    .week-meta p { color:var(--muted);font-size:10px;margin:4px 0 0 }
    .task-list { padding:3px 18px 13px }
    .task-item { display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f2f3ef }
    .task-item:last-child { border-bottom:0 }
    .task-check { appearance:none;width:16px;height:16px;border:1.5px solid #c9d1c9;border-radius:5px;margin:1px 0 0;flex:none;cursor:pointer;position:relative }
    .task-check:checked { background:var(--green-2);border-color:var(--green-2) }
    .task-check:checked:after { content:"✓";position:absolute;color:#fff;font-size:11px;left:2px;top:-1px }
    .task-copy { flex:1;min-width:0 }
    .task-copy strong { font-size:11px }
    .task-copy p { margin:4px 0 0;color:#848c86;font-size:10px;line-height:1.5 }
    .task-item.done .task-copy strong { color:#96a099;text-decoration:line-through }
    .project-card { padding:18px }
    .project-head { display:flex;justify-content:space-between;gap:8px;align-items:flex-start }
    .project-card h3 { font-size:14px;line-height:1.35;margin:0 }
    .project-card>p { color:#78827b;font-size:10px;line-height:1.6;margin:9px 0 13px }
    .project-meta { color:#849088;font-size:10px;display:flex;gap:12px;margin:11px 0 }
    .checkline { display:flex;gap:8px;align-items:center;color:#66736a;font-size:10px;padding:6px 0 }
    .checkline input { accent-color:var(--green-2) }
    .rubric { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px }
    .rubric-item { padding:12px;background:#f8f9f6;border:1px solid #eceee8;border-radius:10px }
    .rubric-item span { font-size:9px;color:#818b83;display:block;min-height:26px;line-height:1.4 }
    .rubric-item strong { font-size:17px;display:block;margin-top:5px }
    .question-card { padding:18px;background:#f5f7f1;border-radius:13px;border:1px solid #e9eee4 }
    .question-card p { font-size:14px;font-weight:700;line-height:1.55;margin:8px 0 0 }
    .answer-box { min-height:160px }
    .interview-result { display:none }
    .interview-result.visible { display:block;animation:rise .25s ease }
    .score-ring { width:70px;height:70px;border-radius:50%;border:5px solid #dbe8da;display:grid;place-items:center;color:var(--green);font-size:18px;font-weight:800;position:relative }
    .score-ring:after { content:"/100";font-size:8px;color:#8b968d;position:absolute;bottom:10px;font-weight:600 }
    .application-table { width:100%;border-collapse:collapse;min-width:720px }
    .application-table th { text-align:left;color:#89918a;font-size:9px;text-transform:uppercase;letter-spacing:.7px;padding:11px 10px;border-bottom:1px solid var(--line) }
    .application-table td { padding:12px 10px;border-bottom:1px solid #eff0ec;font-size:11px;vertical-align:middle }
    .application-table tr:last-child td { border-bottom:0 }
    .company-cell strong { display:block;font-size:11px }
    .company-cell span { color:#909891;font-size:9px;display:block;margin-top:3px }
    .status-select { border:0;border-radius:99px;padding:6px 8px;font-size:9px;font-weight:750;background:#f0f2ed;color:#65736a;outline:none }
    .status-select[data-value="Interview"] { background:#edf0ff;color:#6175c3 }
    .status-select[data-value="Offer"] { background:#e8f4eb;color:#377b52 }
    .status-select[data-value="Rejected"] { background:#fff0ed;color:#b05e55 }
    .status-select[data-value="No response"] { background:#fff4e3;color:#a67839 }
    .chart-row { display:grid;grid-template-columns:88px 1fr 48px;align-items:center;gap:9px;margin:13px 0 }
    .chart-label { font-size:10px;color:#68746b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis }
    .chart-track { height:9px;background:#f0f2ed;border-radius:8px;overflow:hidden }
    .chart-track i { height:100%;display:block;background:var(--green-2);border-radius:8px;transition:width .35s }
    .chart-value { text-align:right;font-size:10px;font-weight:700;color:#56665b }
    .modal-backdrop { position:fixed;inset:0;background:rgba(24,34,29,.35);z-index:20;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px) }
    .modal-backdrop.open { display:flex;animation:fade .16s ease }
    .modal { width:min(600px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:17px;box-shadow:0 25px 80px rgba(20,35,27,.2);padding:22px }
    .modal-head { display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:18px }
    .modal-head h2 { font-size:18px;margin:0;letter-spacing:-.4px }
    .close-btn { border:0;background:#f2f4ef;border-radius:8px;width:30px;height:30px;color:#637067;font-size:18px }
    .toast { position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);padding:11px 15px;border-radius:10px;background:#263a2e;color:white;font-size:12px;box-shadow:0 8px 25px rgba(20,40,28,.2);opacity:0;pointer-events:none;transition:.24s;z-index:40 }
    .toast.show { opacity:1;transform:translate(-50%,0) }
    .empty { color:#849087;padding:22px;text-align:center;font-size:11px }
    .mobile-brand { display:none }
    .dark-mode { --paper:#151b18;--surface:#202824;--ink:#eff3ef;--muted:#a3afa6;--line:#343f38;--green:#99c5a5;--green-2:#82b390;--soft-green:#2b3d31;--soft-orange:#44342a;--soft-blue:#303653;--soft-rose:#462f2c;--shadow:0 12px 35px rgba(0,0,0,.12) }
    .dark-mode .sidebar,.dark-mode .topbar { background:#1b221e }
    .dark-mode .nav-btn:hover,.dark-mode .nav-btn.active { background:#2b3d31 }
    .dark-mode .sidebar-card { background:#2b3d31 }
    .dark-mode .card,.dark-mode .btn-secondary,.dark-mode .field,.dark-mode .textarea,.dark-mode .select,.dark-mode .filter-chip { background:#202824;color:var(--ink);border-color:#3a453e }
    .dark-mode .hero { background:#244937 }
    .dark-mode .week-head,.dark-mode .task-item,.dark-mode .application-table td,.dark-mode .application-table th { border-color:#343f38 }
    .dark-mode .question-card,.dark-mode .rubric-item,.dark-mode .callout { background:#28342c;border-color:#3b4c3e }
    .dark-mode .progress,.dark-mode .chart-track,.dark-mode .skill-mini { background:#353f38 }
    .dark-mode .week-number,.dark-mode .row-icon { background:#314436;color:#a7d2af }
    .dark-mode .modal { background:#202824 }
    .dark-mode .modal .field,.dark-mode .modal .textarea,.dark-mode .modal .select { background:#19201b }
    .account-shell { padding:25px 0 42px }
    .account-card { display:grid;grid-template-columns:minmax(0,1.05fr) minmax(340px,.95fr);overflow:hidden;min-height:570px;border-radius:22px;background:#fff;border:1px solid var(--line);box-shadow:0 24px 70px rgba(28,45,36,.1) }
    .account-story { background:#204a38;color:#fff;padding:35px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between }
    .account-story:before,.account-story:after { content:"";position:absolute;border:1px solid rgba(255,255,255,.13);width:350px;height:350px;border-radius:50%;right:-140px;top:80px }
    .account-story:after { width:240px;height:240px;right:-84px;top:135px;box-shadow:0 0 0 29px rgba(255,255,255,.035),0 0 0 60px rgba(255,255,255,.025) }
    .account-story>* { position:relative;z-index:1 }
    .account-story .brand-name { font-size:17px }
    .account-story .eyebrow { color:#d5e59d }
    .account-story h2 { font-size:34px;line-height:1.13;letter-spacing:-1.3px;max-width:440px;margin:17px 0 12px }
    .account-story p { color:#d1ded5;max-width:400px;font-size:12px;line-height:1.7 }
    .account-points { display:grid;gap:12px;margin-top:27px }
    .account-point { display:flex;align-items:center;gap:10px;font-size:11px;color:#e4ece6 }
    .account-check { width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#d7ed78 }
    .account-quote { border-top:1px solid rgba(255,255,255,.17);padding-top:17px;color:#d4e0d7;font-size:11px;line-height:1.6 }
    .account-quote strong { color:#fff }
    .account-form-side { padding:32px clamp(22px,5vw,55px);display:flex;flex-direction:column;justify-content:center }
    .auth-tabs { display:flex;gap:6px;border-bottom:1px solid var(--line);margin:18px 0 20px }
    #account-nav-label { max-width:135px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block }
    .auth-tab { padding:9px 11px;background:transparent;border:0;border-bottom:2px solid transparent;color:#7a857c;font-size:11px;font-weight:700 }
    .auth-tab.active { border-bottom-color:var(--green-2);color:var(--green) }
    .auth-form { display:grid;gap:13px }
    .auth-form .btn { width:100%;padding:12px }
    .auth-message { padding:10px 12px;border-radius:9px;background:#f1f5ed;color:#43634a;font-size:11px;line-height:1.5;margin:0 0 12px }
    .auth-message.error { background:#fff0ed;color:#a8504b }
    .auth-divider { display:flex;align-items:center;gap:10px;color:#a1a8a2;font-size:10px;margin:16px 0 }
    .auth-divider:before,.auth-divider:after { content:"";height:1px;background:var(--line);flex:1 }
    .config-panel { margin-top:17px;border:1px solid var(--line);border-radius:11px;padding:12px }
    .config-panel summary { cursor:pointer;font-size:10px;font-weight:750;color:#647068 }
    .config-panel[open] summary { margin-bottom:12px }
    .config-panel .field { font-size:11px }
    .security-note { display:flex;gap:8px;color:#89928b;font-size:9px;line-height:1.5;margin-top:12px }
    .account-status { display:flex;align-items:center;gap:8px;padding:11px 12px;background:#f1f5ed;border-radius:10px;color:#43634a;font-size:11px;margin:0 0 14px }
    .account-status .save-dot { flex:none }
    .setup-steps { display:grid;gap:9px;margin:15px 0 }
    .setup-step { display:grid;grid-template-columns:24px 1fr;gap:9px;font-size:10px;color:#738077;line-height:1.5 }
    .step-index { width:21px;height:21px;border-radius:7px;background:#edf3e9;color:#41644a;display:grid;place-items:center;font-weight:800;font-size:9px }
    .dark-mode .account-card { background:#202824 }
    .dark-mode .account-story { background:#244937 }
    .dark-mode .account-form-side .auth-message,.dark-mode .account-status { background:#2b3d31;color:#c7dec7 }
    .dark-mode .auth-tabs { border-color:var(--line) }
    .dark-mode .config-panel { border-color:var(--line) }
    .dark-mode .config-panel summary { color:#bac5bc }

    let state=loadState(),anonymousWorkspace=structuredClone(state),currentPage='overview',skillFilter='all',interviewIndex=0,recognition=null,toastTimer,saveTimer,cloudSaveTimer;

      const headers=new Headers(options.headers||{});

      if(currentUser&&supabaseClient){const {data,error}=await supabaseClient.auth.getSession();if(error)throw new Error(`Could not read your sign-in session: ${error.message}`);if(data.session?.access_token)headers.set('Authorization',`Bearer ${data.session.access_token}`);}

    function authRedirectUrl(){return window.location.protocol==='file:'?undefined:`${window.location.origin}${window.location.pathname}`;}
    function loadSupabaseSdk(){
      if(window.supabase?.createClient)return Promise.resolve(window.supabase);
      if(!supabaseSdkPromise)supabaseSdkPromise=new Promise((resolve,reject)=>{
          const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js';script.async=true;
          script.onload=()=>window.supabase?.createClient?resolve(window.supabase):reject(new Error('The Supabase JavaScript client did not load from the CDN.'));
          script.onerror=()=>reject(new Error('Could not load the Supabase client. Check your network or CDN access.'));
          document.head.appendChild(script);
        }).catch(error=>{supabaseSdkPromise=null;throw error;});
      return supabaseSdkPromise;
    }
    async function initializeSupabase(){
      if(!supabaseConfig?.url||!supabaseConfig?.key){supabaseClient=null;setSyncStatus('Saved on this device','local');return;}
      try{
        const {createClient}=await loadSupabaseSdk();
        authSubscription?.unsubscribe();
        supabaseClient=createClient(supabaseConfig.url,supabaseConfig.key,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true,flowType:'pkce'}});
        authSubscription=supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY')passwordRecovery=true;void handleAuthSession(session);}).data.subscription;
        const {data,error}=await supabaseClient.auth.getSession();
        if(error)throw error;
        await handleAuthSession(data.session);
        authNotice='Supabase is connected. Sign in, create an account, or use an email link.';
        authNoticeType='info';
      }catch(error){
        clearTimeout(cloudSaveTimer);authSubscription?.unsubscribe();authSubscription=null;
        if(currentUser)state=structuredClone(anonymousWorkspace);
        supabaseClient=null;currentUser=null;lastCloudUserId=null;
        authNotice=`Could not connect to Supabase: ${error.message||'Check the project URL, key, and network connection.'}`;
        authNoticeType='error';
        try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(storageError){console.error('Could not restore the anonymous local workspace after a Supabase connection failure.',storageError);}
        setSyncStatus('Saved on this device','local');
        console.error('Supabase initialization failed.',error);
      }
      if(currentPage==='account')render();
    }
    async function handleAuthSession(session){
      const previousUserId=currentUser?.id;
      currentUser=session?.user||null;
      if(!currentUser){if(previousUserId){clearTimeout(cloudSaveTimer);state=structuredClone(anonymousWorkspace);save();}lastCloudUserId=null;cloudLoadingUserId=null;cloudLoadPromise=null;setSyncStatus('Saved on this device','local');if(currentPage==='account')render();return;}
      if(previousUserId&&previousUserId!==currentUser.id)state=structuredClone(anonymousWorkspace);
      if(lastCloudUserId!==currentUser.id){
        const userId=currentUser.id;
        lastCloudUserId=userId;cloudLoadingUserId=userId;setSyncStatus('Loading your workspace…','saving');
        const pendingLoad=loadCloudWorkspace(userId);cloudLoadPromise=pendingLoad;
        try{await pendingLoad;if(currentUser?.id===userId)setSyncStatus('Synced to your account','cloud');}
        catch(error){if(currentUser?.id===userId){console.error('Could not load the Supabase workspace.',error);setSyncStatus('Cloud sync needs attention','error');authNotice='You are signed in, but your cloud workspace could not load. Check that the included SQL setup ran successfully.';authNoticeType='error';}}
        finally{if(cloudLoadingUserId===userId){cloudLoadingUserId=null;cloudLoadPromise=null;}}
      }else if(cloudLoadingUserId===currentUser.id&&cloudLoadPromise)return;
      else setSyncStatus('Synced to your account','cloud');
      render();
    }
    async function loadCloudWorkspace(userId){
      const {data,error}=await supabaseClient.from('user_workspaces').select('workspace').eq('user_id',userId).maybeSingle();
      if(error)throw error;
      if(currentUser?.id!==userId)return;
      if(data?.workspace){
        if(data.workspace.version!==1)throw new Error('Unsupported workspace data version.');
        state={...structuredClone(sampleState),...data.workspace,apps:Array.isArray(data.workspace.apps)?data.workspace.apps:[],completed:data.workspace.completed||{},milestones:data.workspace.milestones||{}};
        localStorage.setItem(userStoreKey(userId),JSON.stringify(state));render();return;
      }
      if(currentUser?.id!==userId)return;
      const {error:insertError}=await supabaseClient.from('user_workspaces').insert({user_id:userId,workspace:state});
      if(insertError)throw insertError;
      localStorage.setItem(userStoreKey(userId),JSON.stringify(state));
    }
    function validateProjectConfig(urlText,key){
      let url;
      try{url=new URL(urlText);}catch{return 'Enter a valid Supabase project URL.';}
      const localHost=['localhost','127.0.0.1','[::1]'].includes(url.hostname);
      if(url.protocol!=='https:'&&!(url.protocol==='http:'&&localHost))return 'Use an HTTPS project URL (HTTP is allowed for localhost development).';
      if(url.username||url.password||url.search||url.hash||url.pathname!=='/')return 'Enter only the project URL, without credentials, paths, or query parameters.';
      let isPublicKey=key.startsWith('sb_publishable_');
      if(!isPublicKey&&key.split('.').length===3){
        try{const payload=JSON.parse(atob(key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));isPublicKey=payload.role==='anon';}catch{}
      }
      if(!isPublicKey)return 'Use a Supabase publishable key or legacy anon public key. Secret/service-role keys are rejected for browser safety.';
      return '';
    }
    function authErrorMessage(error){
      const message=error?.message||'Authentication failed. Please try again.';
      if(/invalid login credentials/i.test(message))return 'Email or password is incorrect. Try again or use “Forgot password?”.';
      if(/email not confirmed/i.test(message))return 'Confirm your email from the link we sent, then sign in.';
      return message;
    }
    async function submitAuth(form){
      if(!supabaseClient){authNotice='Connect your Supabase project before signing in.';authNoticeType='error';render();return;}
      const data=new FormData(form),email=String(data.get('email')||'').trim(),password=String(data.get('password')||'');
      if(authMode==='signup'&&password!==String(data.get('confirm')||'')){authNotice='Those passwords do not match.';authNoticeType='error';render();return;}
      const submit=form.querySelector('button[type="submit"]');if(submit){submit.disabled=true;submit.textContent='Working securely…';}
      authNotice='';authNoticeType='info';
      try{
        let result;
        if(authMode==='signup')result=await supabaseClient.auth.signUp({email,password,options:authRedirectUrl()?{emailRedirectTo:authRedirectUrl()}:{}});
        else if(authMode==='magic')result=await supabaseClient.auth.signInWithOtp({email,options:authRedirectUrl()?{emailRedirectTo:authRedirectUrl()}:{}});
        else result=await supabaseClient.auth.signInWithPassword({email,password});
        if(result.error)throw result.error;
        if(authMode==='signup'&&!result.data.session)authNotice='Account created. Check your inbox to confirm your email, then come back to sign in.';
        else if(authMode==='magic')authNotice='Secure sign-in link sent. Check your inbox, including spam or promotions.';
        else{authNotice='Signed in. Loading your private workspace…';if(result.data.session)await handleAuthSession(result.data.session);}
        authNoticeType='info';render();
      }catch(error){authNotice=authErrorMessage(error);authNoticeType='error';render();}
    }
    async function submitPasswordChange(form){
      const data=new FormData(form),password=String(data.get('password')||''),confirmation=String(data.get('confirm')||'');
      if(password!==confirmation){authNotice='Those passwords do not match.';authNoticeType='error';render();return;}
      try{const {error}=await supabaseClient.auth.updateUser({password});if(error)throw error;passwordRecovery=false;authNotice='Your password has been updated.';authNoticeType='info';render();}
      catch(error){authNotice=authErrorMessage(error);authNoticeType='error';render();}
    }

      const query=new URLSearchParams({target_role:state.target||'Career pivot',verified_skills:Object.keys(state.quizScores).filter(name=>state.quizScores[name]>=75).join(',')});
      try{const response=await apiRequest(`/api/v1/portfolio/roles?${query}`);state.unlockedRoles=response.roles||[];}
      catch(error){console.info('Using the directional local role match:',error.message);state.unlockedRoles=[{title:state.target||'Target role',match:getStats().readiness,evidence:'Local resume and skill-map alignment.',requirements_to_check:['Compare against each employer’s full job description.']}];}
      save();render();
    }
    async function generateWeeklyReport(){
      const missing=getSkillMap().filter(item=>item.status==='missing').map(item=>item.name),completed=Object.values(state.completed).filter(Boolean).length;
      const body={preferences:{target_role:state.target||'Career pivot',location:state.location||'Remote',remote_only:false,include_internships:true}};
      const query=new URLSearchParams({completed_tasks:String(completed)});missing.forEach(skill=>query.append('missing_skills',skill));
      const result=await apiOrDemo(`/api/v1/agent/weekly-report?${query}`,body,()=>({generated_at:new Date().toISOString(),opportunities:[{title:`Entry-level ${state.target}`,location:state.location,match:getStats().readiness,source:'Demo recommendation; no live vacancies fetched.',missing_qualifications:missing}],reminders:state.apps.filter(app=>app.status==='Applied'||app.status==='No response').map(app=>`Review follow-up timing for ${app.company} — ${app.role}.`),progress_summary:`${completed} learning tasks completed; ${missing.length} priority skills remain.`,portfolio_suggestions:missing.slice(0,3).map(skill=>`Build a reviewable ${skill} example and document your decisions.`),weekly_focus:missing.slice(0,3),pending_approvals:[],ai_generated:false}));
      state.careerReport=result.data;save();render();toast(result.source==='api'?'Your on-demand career report is ready.':'Demo report ready; no jobs were searched and no actions were taken.');
    }
    async function analyzeApplications(){
      const records=(state.apps||[]).map(app=>({role_title:app.role,role_type:app.type||'',company:app.company,company_size:'',company_type:'',work_mode:'unspecified',required_stack:[],resume_version:app.approach||'',status:({'Applied':'applied','No response':'ghosted','Interview':'interview','Offer':'offer','Rejected':'rejected'}[app.status]||'applied'),notes:app.notes||''}));
      if(!records.length){state.applicationAnalysis=null;return;}
      try{state.applicationAnalysis=await apiRequest('/api/v1/applications/analyze',{method:'POST',body:JSON.stringify(records)});save();if(['applications','overview'].includes(currentPage))render();}
      catch(error){console.info('Application analytics are using the local tracker:',error.message);state.applicationAnalysis=null;if(['applications','overview'].includes(currentPage))render();}
    }
    function startPrintResume(){save();window.print();}
    document.addEventListener('click',event=>{
      const navBtn=event.target.closest('[data-nav]');if(navBtn){nav(navBtn.dataset.nav);document.getElementById('modal-root').innerHTML='';return;}
      const pageBtn=event.target.closest('[data-page]');if(pageBtn){nav(pageBtn.dataset.page);return;}
      const button=event.target.closest('[data-action]');if(!button)return;
      const action=button.dataset.action;
      if(action==='sample')loadSample();
      else if(action==='theme'){state.theme=state.theme==='dark'?'light':'dark';save();render();}
      else if(action==='skill-filter'){skillFilter=button.dataset.filter;render();}
      else if(action==='skill-detail')showSkillDetail(button.dataset.skill);
      else if(action==='close-modal'){if(event.target===button||button.classList.contains('close-btn'))document.getElementById('modal-root').innerHTML='';}
      else if(action==='add-application')openApplicationModal();
      else if(action==='delete-app'){state.apps=state.apps.filter(a=>a.id!==button.dataset.app);save();render();toast('Application removed.');}
      else if(action==='adapt')adaptPlan();
      else if(action==='quiz-start')void startDiagnostic();
      else if(action==='quiz-restart')void startDiagnostic();
      else if(action==='calculate-plan')void buildPlan(false,false);
      else if(action==='priority-plan')void buildPlan(true,false);
      else if(action==='reschedule-plan')void buildPlan(!!state.plannerResult?.priority_mode,true);
      else if(action==='refresh-market')void refreshMarket();
      else if(action==='inject-concepts')void (async()=>{try{const result=await apiRequest('/api/v1/scanner/inject-learning-plan',{method:'POST',body:JSON.stringify(state.scanResult?.concepts||[])});state.learningTasks=[...(state.learningTasks||[]),...result.tasks_added.map((title,index)=>({id:`concept-${Date.now()}-${index}`,title,source:'Vibe scanner',estimated_hours:1,done:false}))];save();render();toast(`${result.tasks_added.length} concepts added to your plan.`);}catch(error){state.learningTasks=[...(state.learningTasks||[]),...(state.scanResult?.learning_tasks||[]).map((title,index)=>({id:`concept-${Date.now()}-${index}`,title,source:'Vibe scanner · demo',estimated_hours:1,done:false}))];save();render();toast('API unavailable; demo scanner tasks added to your plan.');}})();
      else if(action==='generate-projects')void generateProjects();
      else if(action==='weekly-report')void generateWeeklyReport();
      else if(action==='verify-milestone')showMilestoneVerification(button.dataset.milestone,button.dataset.title);
      else if(action==='save-resume'){state.livingResumeText=document.getElementById('resume-editor')?.value||'';save();toast('Living resume saved on this device.');}
      else if(action==='print-resume')startPrintResume();
      else if(action==='save-achievement'){const result=state.challengeResults?.[0];if(result){state.milestones[`challenge-${result.record_id}`]=true;save();toast('Assessment added to your achievement record.');}}
      else if(action==='save-bullet'){const index=Number(button.dataset.index);if(state.pendingBullets[index]){state.livingResume=[...(state.livingResume||[]),state.pendingBullets[index]];state.livingResumeText='';state.pendingBullets.splice(index,1);save();render();toast('Approved bullet added to your living resume.');}}
      else if(action==='roadblock')showRoadblockModal();
      else if(action==='new-question')void loadInterviewQuestion();
      else if(action==='score-answer')scoreAnswer();
      else if(action==='voice')toggleVoice();
      else if(action==='complete-task'){state.completed[button.dataset.task]=true;save();render();toast('Task complete. Nice momentum.');}
      else if(action==='auth-mode'){authMode=button.dataset.mode;authNotice='';render();}
      else if(action==='signout'){void signOut();}
      else if(action==='disconnect-project'){void disconnectProject();}
      else if(action==='reset-password'){void sendPasswordReset();}
      else if(action==='google-auth'){void startGoogleAuth();}
    });
    document.addEventListener('change',event=>{
      const el=event.target;
      if(el.id==='resume-file'&&el.files?.[0]){const file=el.files[0],formData=new FormData();formData.append('file',file);void (async()=>{try{const parsed=await apiRequest('/api/v1/intake/parse',{method:'POST',body:formData});state.resume=parsed.extracted_text||'';if(parsed.name&&!state.name)state.name=parsed.name;save();render();toast(`Resume parsed (${parsed.source}). Review the extracted text and save your profile.`);}catch(error){if(/\.(txt|md|csv)$/i.test(file.name)){const reader=new FileReader();reader.onload=()=>{state.resume=String(reader.result||'');save();render();toast('API unavailable; text resume loaded locally.');};reader.onerror=()=>toast('Could not read that file. Try pasting the resume text instead.');reader.readAsText(file);}else toast(`Resume parsing failed: ${error.message}`);}})();}
      if(el.matches('[data-action="task-check"]')){state.completed[el.dataset.task]=el.checked;save();render();}
      if(el.matches('[data-action="planner-task"]')){state.completed[el.dataset.task]=el.checked;save();render();}
      if(el.matches('[data-action="custom-task"]')){const task=state.learningTasks[Number(el.dataset.index)];if(task){task.done=el.checked;save();render();}}
      if(el.matches('[data-action="approve-bullet"]')){const index=Number(el.dataset.index);if(el.checked){state.livingResume=[...(state.livingResume||[]),state.pendingBullets[index]];state.livingResumeText='';state.pendingBullets.splice(index,1);save();render();toast('Approved bullet added to your living resume.');}}
      if(el.matches('[data-action="milestone"]')){state.milestones[el.dataset.milestone]=el.checked;save();render();void refreshMarket();}
      if(el.matches('[data-action="app-status"]')){const app=state.apps.find(a=>a.id===el.dataset.app);if(app){app.status=el.value;save();render();void analyzeApplications();toast('Application outcome updated.');}}
    });
    document.addEventListener('input',event=>{
      if(!['resume','job-description','target-role'].includes(event.target.id))return;
      if(event.target.id==='resume')state.resume=event.target.value;
      if(event.target.id==='job-description')state.jd=event.target.value;
      if(event.target.id==='target-role')state.target=event.target.value;
      clearTimeout(saveTimer);saveTimer=setTimeout(save,250);
      const preview=document.getElementById('profile-preview'),role=document.getElementById('role-preview'),requirements=document.getElementById('requirements-preview');
      if(preview){const skills=extractFound(document.getElementById('resume').value);preview.innerHTML=skills.length?skills.map(x=>`<span class="tag tag-neutral">${escText(x)}</span>`).join(''):'<span class="card-note">No recognized skills yet.</span>';}
      if(role)role.textContent=document.getElementById('target-role').value||'Add a target role to begin.';
      if(requirements){const skills=extractFound(document.getElementById('job-description').value);requirements.textContent=skills.length?skills.join(' · '):'Paste a job description to identify requirements.';}
    });
    document.addEventListener('submit',async event=>{
      event.preventDefault();const form=event.target;
      if(form.id==='supabase-config-form'){
        const data=new FormData(form),url=String(data.get('url')||'').trim().replace(/\/+$/,''),key=String(data.get('key')||'').trim(),problem=validateProjectConfig(url,key);
        if(problem){authNotice=problem;authNoticeType='error';render();return;}
        try{localStorage.setItem(SUPABASE_CONFIG_KEY,JSON.stringify({url,key}));supabaseConfig={url,key};authNotice='Connecting to your Supabase project…';authNoticeType='info';render();await initializeSupabase();}
        catch(error){console.error('Supabase project configuration could not be saved.',error);authNotice='Could not save this project configuration in this browser.';authNoticeType='error';render();}
        return;
      }
      if(form.id==='auth-form'){await submitAuth(form);return;}
      if(form.id==='recovery-form'){await submitPasswordChange(form);return;}
      if(form.id==='diagnostic-answer-form'){await submitDiagnostic(form);return;}
      if(form.id==='scanner-form'){await scanProject(form);return;}
      if(form.id==='challenge-create-form'){await generateChallenge(form);return;}
      if(form.id==='challenge-submit-form'){await evaluateChallenge(form);return;}
      if(form.id==='bullet-form'){await draftBullets(form);return;}
      if(form.id==='milestone-verify-form'){await verifyMilestone(form);return;}
      if(form.id==='profile-form'){const data=new FormData(form),startDate=String(data.get('start_date')||''),targetDate=String(data.get('target_date')||'');if(startDate&&targetDate&&targetDate<startDate){toast('Choose a target date on or after your plan start date.');return;}const previousTarget=state.target;state.name=String(data.get('name')||'Your profile').trim();state.target=String(data.get('target')||'').trim();state.resume=String(data.get('resume')||'').trim();state.jd=String(data.get('jd')||'').trim();state.location=String(data.get('location')||'United States').trim();state.studyHours=Math.min(16,Math.max(.25,Number(data.get('study_hours'))||1));state.startDate=startDate;state.targetDate=targetDate;state.skillAnalysis=null;state.marketValue=null;if(previousTarget!==state.target){state.quizHistory=[];state.quizScores={};state.quizQuestion=null;state.quizDone=false;}save();render();toast('Career profile saved. Updating the skill map…');await refreshSkillAnalysis(true);toast('Career profile saved and your role analysis updated.');}
      if(form.id==='application-form'){const data=new FormData(form);state.apps.unshift({id:`a${Date.now()}`,company:String(data.get('company')).trim(),role:String(data.get('role')).trim(),type:String(data.get('type')),seniority:String(data.get('seniority')),status:String(data.get('status')),approach:String(data.get('approach')),notes:String(data.get('notes')).trim()});save();nav('applications');document.getElementById('modal-root').innerHTML='';void analyzeApplications();toast('Application added to your tracker.');}
      if(form.id==='roadblock-form'){state.paceNote=String(new FormData(form).get('note')).trim();state.adapted=true;state.adaptInterviewFocus='';state.adaptSkill=getSkillMap().find(x=>x.status==='missing')?.name||getSkillMap().find(x=>x.status==='partial')?.name||'portfolio evidence';save();document.getElementById('modal-root').innerHTML='';await buildPlan(!!state.plannerResult?.priority_mode,true);toast('Roadblock saved. Upcoming plan adapted.');}
    });
    document.addEventListener('keydown',event=>{if(event.key==='Escape')document.getElementById('modal-root').innerHTML='';if(event.key==='Enter'&&event.target.matches('[data-action="skill-detail"]'))showSkillDetail(event.target.dataset.skill);});
    function toggleVoice(){
      const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SpeechRecognition){toast('Speech input is not available in this browser. You can type your answer instead.');return;}
      if(recognition){recognition.stop();recognition=null;return;}
      recognition=new SpeechRecognition();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=true;
      const button=document.getElementById('voice-button');if(button)button.textContent='◉ Listening…';
      recognition.onresult=event=>{const answer=document.getElementById('answer');if(answer){let transcript='';for(let i=0;i<event.results.length;i++)transcript+=event.results[i][0].transcript+' ';answer.value=transcript.trim();}};
      recognition.onerror=()=>{recognition=null;toast('Voice input stopped. You can continue by typing.');const b=document.getElementById('voice-button');if(b)b.textContent='◉ Use voice';};
      recognition.onend=()=>{recognition=null;const b=document.getElementById('voice-button');if(b)b.textContent='◉ Use voice';};
      recognition.start();
    }
    async function signOut(){
      if(!supabaseClient)return;
      try{await flushCloudSave();}catch(error){console.error('Final Supabase sync failed before sign-out.',error);toast('Signing out; your latest edits remain saved on this device.');}
      const {error}=await supabaseClient.auth.signOut();
      if(error){console.error('Supabase sign-out failed.',error);toast(`Could not sign out: ${error.message}`);return;}
      authNotice='You are signed out. Your local demo workspace is still available.';authNoticeType='info';toast('Signed out securely.');
    }
    async function flushCloudSave(){
      clearTimeout(cloudSaveTimer);
      if(!currentUser||!supabaseClient)return;
      const {error}=await supabaseClient.from('user_workspaces').upsert({user_id:currentUser.id,workspace:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});
      if(error)throw error;
    }
    async function disconnectProject(){
      if(currentUser&&supabaseClient){try{await flushCloudSave();}catch(error){console.error('Final Supabase sync failed before disconnect.',error);}const {error}=await supabaseClient.auth.signOut();if(error){console.error('Could not sign out before disconnecting Supabase.',error);toast(`Could not disconnect: ${error.message}`);return;}}
      try{localStorage.removeItem(SUPABASE_CONFIG_KEY);supabaseConfig=null;supabaseClient=null;authSubscription?.unsubscribe();authSubscription=null;currentUser=null;lastCloudUserId=null;authNotice='Supabase is disconnected. Your local workspace remains on this device.';authNoticeType='info';setSyncStatus('Saved on this device','local');render();}
      catch(error){console.error('Could not remove Supabase configuration.',error);toast('Could not remove the saved project configuration.');}
    }
    async function sendPasswordReset(){
      const email=document.getElementById('auth-email')?.value.trim();
      if(!email){authNotice='Enter your email address first, then choose Forgot password.';authNoticeType='error';render();return;}
      if(!supabaseClient)return;
      try{const options=authRedirectUrl()?{redirectTo:authRedirectUrl()}:{};const {error}=await supabaseClient.auth.resetPasswordForEmail(email,options);if(error)throw error;authNotice='If an account exists for that email, a password-reset link is on its way.';authNoticeType='info';render();}
      catch(error){authNotice=authErrorMessage(error);authNoticeType='error';render();}
    }
    async function startGoogleAuth(){
      if(!supabaseClient){toast('Connect a Supabase project first.');return;}
      try{const options=authRedirectUrl()?{redirectTo:authRedirectUrl()}:{};const {error}=await supabaseClient.auth.signInWithOAuth({provider:'google',options});if(error)throw error;}
      catch(error){authNotice=authErrorMessage(error);authNoticeType='error';render();}
    }
    render();
    void checkApi();
    void initializeSupabase();
  </script>
